name: CI - Fast Feedback

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint_and_sast:
    name: Lint & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Linting & SAST tools
        run: pip install ruff "bandit[toml]"
        
      - name: Run Ruff (Linter & Formatter check)
        run: |
          ruff check .
          ruff format --check .
          
      - name: Run Bandit (Python Security)
        run: bandit -r src/ -c pyproject.toml --severity-level high

  unit_tests:
    name: Unit Tests (Linux Only)
    runs-on: ubuntu-latest
    needs: lint_and_sast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (C++ & CGAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config pybind11-dev \
            libboost-all-dev libgmp-dev libmpfr-dev libcgal-dev \
            libspatialindex-dev libgeos-dev libproj-dev \
            libgl1 libglib2.0-0
            
      - name: Install Python Dependencies
        run: pip install -r requirements.txt pytest

      - name: Build C++ Extension (Fast mode)
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/build:${{ github.workspace }}/src
        run: pytest tests/ -v
