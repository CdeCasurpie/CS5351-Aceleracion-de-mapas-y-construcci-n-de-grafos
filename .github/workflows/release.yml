name: CD - Build Wheels & Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-boost-full
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Detect macOS deployment target
        if: runner.os == 'macOS'
        id: macos-target
        run: echo "version=$(sw_vers -productVersion | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "dnf install -y gmp-devel mpfr-devel boost-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install gmp mpfr boost"
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ steps.macos-target.outputs.version }}
            CMAKE_OSX_DEPLOYMENT_TARGET=${{ steps.macos-target.outputs.version }}
          CIBW_BEFORE_ALL_WINDOWS: "vcpkg install boost:x64-windows gmp:x64-windows mpfr:x64-windows"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\vcpkg\\installed\\x64-windows\\bin -w {dest_dir} {wheel}"
          CIBW_SKIP: "cp36-* cp37-* cp38-* pp* *-musllinux_* *i686* *win32*"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  benchmark:
    name: Run thesis benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache OSM network data
        uses: actions/cache@v4
        with:
          path: cache/
          key: osm-cache-barranco-v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-dev build-essential cmake git pkg-config \
            pybind11-dev libboost-all-dev libgmp-dev libmpfr-dev libcgal-dev \
            libspatialindex-dev libgeos-dev libproj-dev libgl1 libglib2.0-0
          pip3 install -r requirements.txt --break-system-packages
      - name: Build C++ extension
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
      - name: Run benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}/build:${{ github.workspace }}/src
        run: python3 scripts/run_benchmark.py
      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: tesis-benchmark-results
          path: outputs/
          retention-days: 90

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist, benchmark]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
