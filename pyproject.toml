[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "geojac"
version = "0.2.2"
description = "Simplificacion de grafos urbanos y analisis de criminalidad"
readme = "README.md"
authors = [{ name="ACJ Team", email="acj-team@utec.edu.pe" }]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "geopandas",
    "osmnx"
]

[project.optional-dependencies]
viz = ["vispy", "PyQt5"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.scikit-build]
wheel.packages = ["src/geojac"]

[tool.pytest.ini_options]
pythonpath = ["src", "build"]
testpaths  = ["tests"]
